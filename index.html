<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NLP Voice Assistant Robot · Malak Mohamed</title>
<meta name="description" content="An offline bilingual voice assistant that answers from course lectures. Built with faster-whisper, FAISS, Gemma 3 and Piper.">
<meta property="og:title" content="NLP Voice Assistant Robot"><meta property="og:description" content="Offline voice assistant in English and Arabic, grounded in course lectures.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&family=Cairo:wght@300;400;600;800&display=swap">
<style>
:root{--bg:#03060c;--panel:#08111f;--ink:#e8f1ff;--mute:#8aa3c4;--b:#6fc3ff;--b2:#1f4e8c;--line:#14243b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 600px at 75% 0,#0d2a4d 0,var(--bg) 65%) fixed;color:var(--ink);font:300 1rem/1.7 "Manrope",system-ui,sans-serif}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] button{font-family:"Cairo","Manrope",sans-serif}
button,input{font:inherit}.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;z-index:5;background:#03060cc0;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:64px}
nav div{display:flex;gap:26px;align-items:center;font-size:.92rem}nav a{color:var(--mute);text-decoration:none}nav a:hover{color:var(--ink)}
.logo{font-weight:800;display:flex;gap:10px;align-items:center}.logo i{width:12px;height:12px;border-radius:3px;background:var(--b);box-shadow:0 0 14px var(--b)}
.lang{background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 16px;cursor:pointer}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:40px 0 70px}
h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0 0 16px}
[dir=rtl] h1{line-height:1.3;letter-spacing:0}
.lead{color:var(--mute);max-width:50ch;margin:0 0 26px}
.console{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;max-width:560px}
.mode{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--b);margin-bottom:8px}.mode i{width:8px;height:8px;border-radius:50%;background:var(--b);box-shadow:0 0 10px var(--b)}
.log{min-height:70px;max-height:170px;overflow:auto;font-size:.95rem}.log p{margin:0 0 8px}.log .u{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input{flex:1;min-width:140px;background:#000;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px}
button{padding:11px 18px;border:0;border-radius:12px;background:var(--b2);color:#fff;cursor:pointer}
#send{background:var(--b);color:#03111f;font-weight:600}.row .alt{background:#0d1c31;color:var(--b);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.stage{position:relative;background:radial-gradient(60% 50% at 50% 72%,#14477e77,transparent 70%),#000;border:1px solid var(--line);border-radius:28px;padding:16px 8px 0;overflow:hidden}
.stage::after{content:"";position:absolute;left:22%;right:22%;bottom:8px;height:14px;border-radius:50%;background:radial-gradient(#6fc3ff99,transparent 70%);filter:blur(6px)}
#s{height:min(76vh,680px);max-width:100%;display:block;margin:0 auto;transform:scale(var(--fx,1),var(--fy,1))}
section{padding:68px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin:0 0 10px}[dir=rtl] h2{letter-spacing:0}
.sub{color:var(--mute);max-width:58ch;margin:0 0 34px}
.feat{display:grid;grid-template-columns:repeat(3,1fr)}.feat div{padding:4px 28px;border-inline-start:1px solid var(--line)}.feat div:first-child{border:0;padding-inline-start:0}
.feat b{display:block;color:var(--b);font-weight:600;margin-bottom:6px}.feat span{color:var(--mute);font-size:.95rem}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;counter-reset:s}
.st{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;counter-increment:s}
.st::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--b);color:var(--b);font-size:.8rem;margin-bottom:10px}
.st b{display:block}.st span{color:var(--mute);font-size:.86rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.two div{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--panel)}
.two b{color:var(--b)}.two p{margin:6px 0 0;color:var(--mute)}
details{margin-top:18px;color:var(--mute)}summary{cursor:pointer}details .row{margin-top:10px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mute);font-size:.88rem}
@media(max-width:860px){.hero{grid-template-columns:1fr}.feat{grid-template-columns:1fr;gap:20px}.feat div{border:0;padding:0}.flow{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}nav div a{display:none}.stage{order:-1}#s{height:min(60vh,520px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(70% 60% at 50% 0,#000,transparent)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}.tags span{border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:.84rem;color:var(--b);background:#0a1a2f}
.cta{display:flex;gap:12px;flex-wrap:wrap}.cta a{text-decoration:none;border-radius:12px;padding:12px 24px;font-weight:600}
.p1{background:var(--b);color:#03111f}.p2{border:1px solid var(--line);color:var(--ink)}
.stage .console{margin:6px 8px 12px;max-width:none;position:relative;z-index:2;background:#050c18e6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:20px;background:var(--panel);margin-bottom:10px}
.stats div{padding:24px;border-inline-start:1px solid var(--line)}.stats div:first-child{border:0}
.stats b{display:block;font-size:1.5rem;font-weight:800;color:var(--b)}.stats span{color:var(--mute);font-size:.88rem}
dl{margin:0;border-top:1px solid var(--line)}dl div{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
dt{color:var(--b);font-weight:600}dd{margin:0;color:var(--mute)}
.me{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:24px;padding:28px}
.av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--b2));display:grid;place-items:center;font-weight:800;font-size:1.7rem;color:#03111f}
.me h3{margin:0;font-size:1.3rem}.me p{margin:2px 0 12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:.84rem}
.st.wip{border-style:dashed}
@media(max-width:860px){.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border:0}dl div{grid-template-columns:1fr;gap:4px}.me{grid-template-columns:1fr}}

.stage{border-color:#1d4a7a;box-shadow:0 0 0 1px #6fc3ff14 inset,0 40px 120px #0a3a7044}
.stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,#6fc3ff0c 0 1px,transparent 1px 4px),linear-gradient(180deg,transparent 0,#6fc3ff22 50%,transparent 100%) 0 -100%/100% 30% no-repeat;animation:scan 6s linear infinite}
@keyframes scan{to{background-position:0 0,0 400%}}
.stage::after{left:8%;right:8%;bottom:70px;height:60px;border-radius:0;filter:none;background:radial-gradient(ellipse at center,transparent 36%,#6fc3ff77 37%,transparent 39%,transparent 55%,#6fc3ff44 56%,transparent 58%,transparent 72%,#6fc3ff22 73%,transparent 75%)}
h1{font-size:clamp(2.4rem,5.4vw,4.3rem)}
.flow{position:relative}.flow::before{content:"";position:absolute;top:13px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--b),transparent)}
.st{border:0;background:none;text-align:center;padding:0 6px}.st::before{margin:0 auto 14px;width:28px;height:28px;background:var(--bg);box-shadow:0 0 20px #6fc3ff66;position:relative}
.st.wip::before{border-style:dashed;box-shadow:none;color:var(--mute);border-color:var(--mute)}
.arch{display:flex;align-items:stretch;gap:16px;margin-top:44px}.arch div{flex:1;border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--panel)}
.arch b{display:block;color:var(--b)}.arch span{color:var(--mute);font-size:.94rem}
.arch em{align-self:center;color:var(--b);font-style:normal;font-size:.85rem;border:1px dashed var(--b2);border-radius:99px;padding:4px 14px}
.next{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.next b{color:var(--b);margin-inline-end:6px}
.next span{border:1px dashed var(--b2);border-radius:99px;padding:5px 16px;font-size:.88rem;color:var(--ink)}
section{padding:84px 0}
.foot2{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.foot2 a{color:var(--b);text-decoration:none}
@media(max-width:860px){.arch{flex-direction:column}.arch em{align-self:center}.flow::before{display:none}}
body::after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(460px 460px at 10% 16%,#2f7bff66,transparent 70%),radial-gradient(540px 540px at 90% 28%,#8a5cff55,transparent 70%),radial-gradient(500px 500px at 45% 88%,#18d6c250,transparent 70%)}
.console,.stats,.arch div,.me,.tags span,.chips span,.lang,.p2,.next span,.arch em{background:linear-gradient(135deg,#ffffff22,#ffffff08);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid #ffffff2b;box-shadow:0 10px 36px #00000059,inset 0 1px 0 #ffffff38}
.stage .console{background:linear-gradient(135deg,#ffffff26,#ffffff0a)}
header{background:#050d1a59;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid #ffffff22}
input{background:#ffffff14;border:1px solid #ffffff2b;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.row .alt{background:#ffffff14;border:1px solid #ffffff2b;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stage{border:1px solid #ffffff33;box-shadow:0 30px 90px #00000080,inset 0 1px 0 #ffffff40}
.st::before{background:#ffffff18;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:#6fc3ffaa}
.stats div{border-inline-start:1px solid #ffffff1f}.stats div:first-child{border:0}
dl,dl div{border-color:#ffffff1f}
.arch em{border-style:solid}
.mode .btns{margin-inline-start:auto;display:flex;gap:6px}.sm{padding:5px 12px;font-size:.8rem;border-radius:10px}
.hp{margin-bottom:10px;max-height:190px;overflow:auto;border-top:1px solid #ffffff22;border-bottom:1px solid #ffffff22;padding:8px 0;font-size:.9rem;color:var(--mute)}.hp[hidden]{display:none}
.hp .it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}.hp .it:hover{background:#ffffff14}
.hp .it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hp .it small{color:var(--mute)}.hp .it .sm{padding:2px 9px}
@media(prefers-reduced-motion:reduce){.stage::before{animation:none}}

<script>let LIVE=false;</script>
<script>
const $=id=>document.getElementById(id);
let waveEnd=0, raiseS=0, ampS=1, level=0, target=0, ctx, an, buf, gazeX=0, gazeY=0, gx=0, gy=0, blink=0, nextBlink=2, t0=performance.now();
function setup(){ if(ctx) return; ctx=new (window.AudioContext||window.webkitAudioContext)(); an=ctx.createAnalyser(); an.fftSize=1024; buf=new Float32Array(an.fftSize); }
function rms(){ an.getFloatTimeDomainData(buf); let s=0; for(const v of buf) s+=v*v; return Math.sqrt(s/buf.length); }
/* PUBLIC API: speakUrl(url) plays audio and lip-syncs; setMouth(0..1) drives the mouth manually */
let playing=false;
async function speakUrl(url,wave){ setup(); await ctx.resume(); const r=await fetch(url); const ab=await ctx.decodeAudioData(await r.arrayBuffer());
  const src=ctx.createBufferSource(); src.buffer=ab; src.connect(an); an.connect(ctx.destination); playing=true; if(wave) waveEnd=performance.now()+ab.duration*1000+500;
  await new Promise(res=>{src.onended=res; src.start();}); an.disconnect(); playing=false; target=0; }
window.speakUrl=speakUrl; window.setMouth=v=>{target=v};
$('go').onclick=()=>{setup();ctx.resume();$('go').textContent='Sound ready ✓';try{navigator.wakeLock.request('screen')}catch(e){}};
/* hologram box: mirror / flip, remembered on this device (or ?mirror=1&flip=1 in the URL) */
let FX=1, FY=1;
function applyFlip(){ document.documentElement.style.setProperty('--fx',FX); document.documentElement.style.setProperty('--fy',FY); try{localStorage.setItem('avatarFlip',JSON.stringify([FX,FY]))}catch(e){} }
try{ const s=JSON.parse(localStorage.getItem('avatarFlip')||'null'); if(s){FX=s[0];FY=s[1];} }catch(e){}
{ const q=new URLSearchParams(location.search); if(q.has('mirror')) FX=q.get('mirror')==='1'?-1:1; if(q.has('flip')) FY=q.get('flip')==='1'?-1:1; }
applyFlip();
$('fx').onclick=()=>{FX=-FX;applyFlip()}; $('fy').onclick=()=>{FY=-FY;applyFlip()};
function sendQ(){const v=$('q').value.trim();if(v){fetch('/ask?q='+encodeURIComponent(v));$('q').value='';}}
$('send').onclick=sendQ;$('q').onkeydown=e=>{if(e.key==='Enter')sendQ()};
if(!['localhost','127.0.0.1'].includes(location.hostname))$('mic').style.display='none';
$('mic').onclick=async()=>{setup();await ctx.resume();const st=await navigator.mediaDevices.getUserMedia({audio:true});ctx.createMediaStreamSource(st).connect(an);playing=true;$('mic').textContent='Mic on';};
/* poll the Python server for new replies */
if(location.protocol.startsWith('http')) (async function poll(){ try{ if(!playing){ const r=await fetch('/next?'+Date.now()); if(r.status==200){ const u=URL.createObjectURL(await r.blob()); await speakUrl(u,r.headers.get('X-Gesture')==='wave');} } }catch(e){} setTimeout(poll,LIVE?250:5000); })();
function mouthPath(o,s){ const w=34+o*8, top=-o*26*0.5, bot=10+o*30; // closed = smile, open = round
  return `M${-w} 0 Q0 ${top*2} ${w} 0 Q0 ${bot*2-top} ${-w} 0 Z`; }
function frame(now){
  const t=(now-t0)/1000;
  if(an&&playing){ target=Math.min(1,rms()*9); }
  level+=(target-level)*0.45;
  const o=level, m=$('m'); m.setAttribute('transform','translate(532 283)'); m.setAttribute('d',mouthPath(o)); m.setAttribute('fill',o>0.08?'#0b1a2e':'none'); m.setAttribute('stroke-width',o>0.08?7:7);
  if(t>nextBlink){blink=1;nextBlink=t+2+Math.random()*3.5;}
  blink=Math.max(0,blink-0.12); const bs=blink>0?Math.abs(blink*2-1)*0.9+0.1:1;
  if(Math.random()<0.012){gazeX=(Math.random()-.5)*34;gazeY=(Math.random()-.5)*18;}
  gx+=(gazeX-gx)*0.15; gy+=(gazeY-gy)*0.15;
  for(const [id,cx] of [['eL',443],['eR',615]]){ const e=$(id); e.setAttribute('cx',cx+gx); e.setAttribute('cy',238+gy); e.setAttribute('ry',24*bs*(1+o*0.08)); }
  raiseS+=((performance.now()<waveEnd?1:0)-raiseS)*0.07;
  const w=Math.sin(t*(playing?3.2:7)), r=(id,a,x,y)=>$(id).setAttribute('transform',`rotate(${a} ${x} ${y})`);
  r('whand',w*16*raiseS+(1-raiseS)*4,250,510); r('warm',raiseS*(Math.sin(t*3.5)*5-2)+(1-raiseS)*(-158+Math.sin(t*1.2)*2),355,625);
  r('rarm',Math.sin(t*1.3)*(2.5+(playing?3:0)),720,690);const k=Math.min(1,raiseS*2);$('warm').setAttribute('opacity',k);$('larmr').setAttribute('opacity',1-k);
  const st=Math.sin(t*(playing?2.4:1.6)); const lift=(p)=>Math.max(0,Math.sin(t*(playing?2.4:1.6)+p));
  $('legL').setAttribute('transform',`translate(0 ${-7*lift(0)}) rotate(${st*2.2} 445 1140)`);
  $('legR').setAttribute('transform',`translate(0 ${-7*lift(Math.PI)}) rotate(${-st*2.2} 665 1140)`);
  $('fig').setAttribute('transform',`rotate(${Math.sin(t*0.8)*1.2} 545 1520) translate(0 ${Math.sin(t*1.6)*3+o*3})`);
  requestAnimationFrame(frame);
}
addEventListener('mousemove',e=>{const r=$('s').getBoundingClientRect();gazeX=Math.max(-17,Math.min(17,((e.clientX-r.left)/r.width-.5)*60*FX));gazeY=Math.max(-9,Math.min(9,((e.clientY-r.top)/r.height-.2)*30));});
requestAnimationFrame(frame);
</script>

let L="en";const lg=$("log");
let H=[],cur=null;try{H=JSON.parse(localStorage.getItem("chatH")||"[]")}catch(e){}
function save(){try{localStorage.setItem("chatH",JSON.stringify(H.slice(0,30)))}catch(e){}}
function rec(c,x){if(!cur){cur={id:Date.now(),t:x.slice(0,42),m:[]};H.unshift(cur)}cur.m.push([c,x]);save();renderH()}
function renderH(){const hl=$("hl");hl.innerHTML="";if(!H.length){hl.textContent=T[L].emp;return}
H.forEach(s=>{const d=document.createElement("div");d.className="it";const a=document.createElement("span");a.textContent=s.t;const b=document.createElement("small");b.textContent=new Date(s.id).toLocaleDateString(L=="ar"?"ar-EG":"en-GB",{day:"numeric",month:"short"});
const x=document.createElement("button");x.textContent="×";x.className="alt sm";x.setAttribute("aria-label","Delete");d.append(a,b,x);
d.onclick=()=>{cur=s;lg.innerHTML="";s.m.forEach(m=>draw(m[1],m[0]));$("hp").hidden=true};
x.onclick=e=>{e.stopPropagation();H=H.filter(h=>h!==s);if(cur===s){cur=null;lg.innerHTML=""}save();renderH()};hl.appendChild(d)})}
$("hist").onclick=()=>{$("hp").hidden=!$("hp").hidden;renderH()};
$("newc").onclick=()=>{cur=null;lg.innerHTML="";$("hp").hidden=true};
$("clr").onclick=()=>{H=[];cur=null;lg.innerHTML="";save();renderH()};

$("go").textContent=t.go;if(!/localhost|127\.0\.0\.1/.test(location.hostname))$("mic").style.display="none";else $("mic").textContent=t.mic;

function pickVoice(lang){const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(lang.slice(0,2)));const f=/female|zira|samantha|hoda|salma|laila|zariyah|hazel|susan|aria|jenny|karen|moira|tessa|victoria|zeina|amira|ava|allison|google us english|google uk english female/i,m=/(?<!fe)male|maged|naayf|hamed|david|mark|james|fred|daniel|tarik|george|guy|ryan/i;return vs.find(v=>f.test(v.name)&&!m.test(v.name))||vs.find(v=>!m.test(v.name))||vs[0]}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
function ask(){const v=$("q").value.trim();if(!v)return;$("q").value="";add(v,"u");if(LIVE){fetch("/ask?q="+encodeURIComponent(v));return}
let r=T[L].d;for(const [re,a] of T[L].a)if(re.test(v.toLowerCase())){r=a;break}
add(r);if(/hello|hi\b|hey|مرحبا|اهلا|أهلا|ازيك|هاي/.test(v.toLowerCase()))waveEnd=performance.now()+3000;
if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(r);u.lang=L=="ar"?"ar-EG":"en-US";const fv=pickVoice(u.lang);if(fv){u.voice=fv;u.lang=fv.lang}u.pitch=1.15;let iv;
u.onstart=()=>{iv=setInterval(()=>setMouth(.25+Math.random()*.6),110)};u.onend=u.onerror=()=>{clearInterval(iv);setMouth(0)};speechSynthesis.speak(u)}
